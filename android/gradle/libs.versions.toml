[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.10"
hilt = "2.60.1"

# Material 3 Expressive. Alpha is a deliberate, constitution-sanctioned choice: the Expressive
# component set is what the product's design language is built on. Usage is confined to
# core:designsystem so an alpha bump is a one-module change.
material3 = "1.5.0-alpha24"
composeBom = "2026.06.00"

# Health Connect stays on the stable release: Principle VI puts data fidelity above novelty.
healthConnect = "1.1.0"

activityCompose = "1.12.4"
lifecycle = "2.10.0"
room = "2.8.3"
work = "2.11.2"
hiltWork = "1.3.0"
navigation = "2.9.6"
datastore = "1.1.7"
securityCrypto = "1.1.0"
okhttp = "5.2.1"
serialization = "1.9.0"
coroutines = "1.11.0"
maplibre = "13.4.1"
browser = "1.9.0"
junit = "5.14.0"
truth = "1.4.5"
robolectric = "4.16"
coreKtx = "1.19.0"
splashscreen = "1.2.0"

[libraries]
# Consumed by build-logic so the convention plugins can configure the Android and Kotlin
# extensions; they are compileOnly there, never shipped.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

androidx-core-ktx ={ module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
# Pinned outside the BOM: the BOM tracks stable Material 3, and Expressive lives in alpha.
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
# The base set — the couple of hundred icons Material ships as standard, which is every icon
# this app has ever needed. `-extended` is the ~5 MB catalogue of all of them and is still only a
# catalogue entry: reach for it when a screen genuinely needs a glyph that is not in core.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }

lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltWork" }

health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hiltWork" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hiltWork" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

maplibre = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
# Gradle needs the launcher on the test runtime classpath or the worker cannot start.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
