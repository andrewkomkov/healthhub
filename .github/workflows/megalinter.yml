name: megalinter

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write # PR comment reporter
  pull-requests: write
  security-events: write # SARIF upload into the Security tab

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          # MegaLinter diffs against the base branch on pull requests, which needs history.
          fetch-depth: 0

      # The token files are generated, not committed. Without this step the Kotlin theme and
      # the CSS custom properties are missing and their consumers look broken to the linters.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node packages/design-tokens/build.mjs

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@v9.6.0
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event_name != 'pull_request' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: megalinter-reports
          path: |
            megalinter-reports/
            mega-linter.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload SARIF to the Security tab
        if: always() && hashFiles('megalinter-reports/megalinter-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif
