name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA rather than tag: a tag can be moved, and this job
      # is handed a token.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Shallow clones weaken the relevancy of the analysis — Sonar uses history to
          # attribute issues to the change that introduced them.
          fetch-depth: 0

      # The design tokens are generated rather than committed, so without this step Sonar
      # analyses sources whose imports do not resolve.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node packages/design-tokens/build.mjs

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
