name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'specs/**', '*.md']
  workflow_dispatch:

# One deployment at a time; a queued run supersedes an older one rather than racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build web and typecheck Worker
        run: npm run build

      # The Worker and the SPA ship together — the web build is this Worker's static assets.
      - name: Deploy
        run: npx wrangler deploy --config worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply healthhub --remote --config worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check
        run: |
          # `_` rather than `i`: the counter is never read, and shellcheck's SC2034 is
          # right that a named-but-unused variable is usually a mistake.
          for _ in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://healthhub.andrew-komkov.workers.dev/api/health)
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            sleep 5
          done
          echo "deployment did not become healthy"; exit 1
