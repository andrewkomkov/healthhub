name: release

# A tag is the release. `git tag v0.2.0 && git push --tags` publishes an installable APK and
# nothing else has to be remembered — no version bumped in a file, no artefact uploaded by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.1.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The release notes are generated from history, so a shallow clone would produce a
          # release that claims to contain one commit.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The Android theme is generated from the same token source as the web client; without
      # this step the designsystem module has nothing to compile against.
      - name: Generate design tokens
        run: npm run tokens

      - uses: gradle/actions/setup-gradle@v5

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # One redirect rather than three (shellcheck SC2129). The version code is monotonic
          # by construction: one that ever goes backwards is an APK the phone refuses to install
          # over the one already on it, with a message that blames the phone rather than the
          # build.
          {
            echo "name=$version"
            echo "tag=v$version"
            echo "code=${{ github.run_number }}"
          } >> "$GITHUB_OUTPUT"

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon test

      # Written to a file the job owns and deleted with the runner. The alternative — a path
      # inside the checkout — is one `git add -A` away from being published.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — the APK would be unsigned"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew --no-daemon :app:assembleRelease

      # A release build with no signature installs on nothing, and the failure surfaces on a
      # phone rather than here. Cheap to check, so it is checked.
      - name: Verify the signature
        run: |
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk"
          mv "$apk" "healthhub-${{ steps.version.outputs.name }}.apk"

      # The in-app updater downloads this beside the APK and refuses to install a file that
      # does not match it. The signature check the system performs is what decides whether an
      # APK may replace the installed app; this catches the other failure — a download that
      # arrived truncated or altered — before the athlete is asked to confirm anything.
      - name: Publish the checksum beside it
        env:
          APK: healthhub-${{ steps.version.outputs.name }}.apk
        run: sha256sum "$APK" > "$APK.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: healthhub-${{ steps.version.outputs.name }}.apk
        run: |
          cat > notes.md <<'NOTES'
          Install the APK on an Android 9 or newer phone, then sign in and run a sync.

          An app already installed from a previous release will offer this one by itself:
          it asks GitHub for the latest release twice a day, and installs it after you
          confirm. Updates → Check for updates does the same on demand.

          The app talks to the deployment it was built against — a fork building its own APK
          points it elsewhere with `HEALTHHUB_BASE_URL` in `local.properties`. Analysis runs on
          the phone; the Worker stores what the phone computed and never recomputes it.
          NOTES

          # Re-running a release must not fail on "already exists": the artefact is what matters,
          # and replacing it is the point of running it again.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "HealthHub ${{ steps.version.outputs.name }}" \
              --notes-file notes.md \
              --generate-notes
          fi
