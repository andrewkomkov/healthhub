# SonarQube Cloud analysis.
#
# The project key comes from the SonarCloud project as created; note it reads
# "cycplus-m2-sync" while this repository is "healthhub" — kept as given so the analysis
# lands in the existing project rather than silently creating a second one.

sonar.projectKey=andrewkomkov_cycplus-m2-sync
sonar.organization=andrewkomkov

sonar.projectName=HealthHub
sonar.projectVersion=0.1.0

sonar.sources=android/app/src,android/core,android/feature,worker/src,web/src,packages/design-tokens
sonar.tests=android/core/telemetry/src/test,worker/test,web/src

sonar.sourceEncoding=UTF-8

# Kotlin needs the JVM target to resolve its analyser rules correctly.
sonar.java.source=21
sonar.kotlin.source=2.4

# Generated artefacts and build output. Analysing a file that a build step rewrites reports
# issues nobody can fix in source.
sonar.exclusions=\
  **/build/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/.gradle/**,\
  **/.wrangler/**,\
  web/src/core/m3e/generated-tokens.css,\
  android/core/designsystem/src/main/kotlin/dev/healthhub/core/designsystem/GeneratedTokens.kt,\
  android/gradle/wrapper/**

sonar.test.inclusions=**/*Test.kt,**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# The codec is deliberately implemented twice — once in Kotlin for the phone, once in
# TypeScript for the browser — so cross-language duplication reports there are by design.
sonar.cpd.exclusions=\
  android/core/telemetry/**,\
  web/src/core/telemetry/**,\
  packages/design-tokens/**
